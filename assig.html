<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #111827;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 45px 55px 60px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 20px;
            color: #4b5563;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #111827;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d9dde3;
            border-radius: 3px;
            background: #fff;
            color: #1f2937;
            font-family: inherit;
            font-size: 18px;
            outline: none;
            transition: border-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        input,
        select {
            height: 58px;
            padding: 0 18px;
        }

        textarea {
            min-height: 155px;
            padding: 18px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #4b5563;
            opacity: 1;
        }

        select {
            appearance: auto;
            cursor: pointer;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        /* Save Button */
        .button-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .save-btn {
            width: auto;
            min-width: 150px;
            height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.2s ease;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }

            .profile-container {
                padding: 30px 25px 40px;
            }

            .header {
                margin-bottom: 30px;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 17px;
                line-height: 1.5;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 25px;
                margin-bottom: 25px;
            }

            label {
                font-size: 16px;
            }

            input,
            select,
            textarea {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .profile-container {
                padding: 25px 18px 35px;
                border-radius: 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header p {
                font-size: 15px;
            }

            input,
            select {
                height: 52px;
            }

            textarea {
                min-height: 130px;
            }

            .save-btn {
                min-width: 130px;
                height: 45px;
                padding: 0 18px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="profile-container">

        <header class="header">
            <h1>Edit Profile</h1>
            <p>Update your personal details and public profile.</p>
        </header>

        <form>

            <!-- First Name & Last Name -->
            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="e.g. Jane"
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="e.g. Doe"
                    >
                </div>

            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="jane@example.com"
                >
            </div>

            <!-- City & Country -->
            <div class="form-row">

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="e.g. Lagos"
                    >
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country">
                        <option value="" selected disabled>
                            Select a country
                        </option>
                        <option value="nigeria">Nigeria</option>
                        <option value="ghana">Ghana</option>
                        <option value="kenya">Kenya</option>
                        <option value="south-africa">South Africa</option>
                        <option value="united-kingdom">United Kingdom</option>
                        <option value="united-states">United States</option>
                        <option value="canada">Canada</option>
                    </select>
                </div>

            </div>

            <!-- Bio -->
            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea
                    id="bio"
                    name="bio"
                    placeholder="Tell us a little bit about yourself..."
                ></textarea>
            </div>

            <!-- Save Changes Button -->
            <div class="button-container">
                <button type="submit" class="save-btn">
                    Save Changes
                </button>
            </div>

        </form>

    </main>

</body>
</html>
