<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- Play Audio -->
  <p>play my song</p>
  <audio controls loop>
    <source src="Kenya Grace Strangers.mp3" type="audio/mp3">
    Audio not supported by your browser
  </audio>

  <!-- Play Video -->
  <p>Play my video</p>
  <video width="720px" controls loop draggable="true">
    <source src="Code Jam 2019.mp4" type="video/mp4">
    Video not supported by your browser
  </video>
  
  <!-- Progress -->
  <p>undefine progress</p>
  <progress>
  </progress>
 
  <p>Static progress</p>
  <progress min="0" max="50" value="50">
  </progress>
  
</body>
</html>
