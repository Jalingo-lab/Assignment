<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

<Style>
    .container {
        background-color: rgb(17, 77, 57);
        width: 50%;
        padding: 10px;
        border-radius: 20px;
    }

    .screen {
        position: relative;
       }

    .screen audio {
        position: absolute;
        bottom: 5%;
        right: 5px;
        left: 5px;
        color: azure;
        background-color: black;
        padding: 5px 10px;
        visibility: visible;

    }
 .main-image {
    width: 100%;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;

 }

 .detail-bar {
    background-color: white;
    display: flex;
    justify-content: space-between;
    padding: 5px;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;

 }

 #profile-image {
    width: 25%;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;

 }

    
</Style>
    
</head>

<body>
    <div class="container">
        <div class="screen">
            <img class="main-image" src="royal.jpeg" 
            alt="">
            <audio src="videoplayback.m4a" controls ></audio>
        </div>

        <div class="detail-bar">
            <div>
                <p><strong>Title:</strong> Mr.</p>
                <p><strong>Name:</strong> Usman Abdulrazaq Jalingo</p>
                <p><strong>Royal Title:</strong> Chigarin Muri</p>
            </div>
            <img id="profile-image" src="royal.jpeg" alt="">
        </div>
    </div>


</body>
</html>
