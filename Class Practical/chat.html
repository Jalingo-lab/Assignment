<!DOCTYPE html>
<html>
<head>
<title>Card with Images</title>

<style>
.card{
  width:600px;
  border:25px solid #4e444462;
  border-top-right-radius: 40px;
  border-top-left-radius: 40px;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
  font-family:Arial, sans-serif;
}

.div1{
  text-align:center;
  padding:10px;
}

.div1 img{
  width: 200px;
  height:300px;
  object-fit: cover;
  border-radius: 30px;
}

.div2{
  padding:15px;
  text-align:center;
}

.div3{
  text-align:center;
  padding: 10px;
}

.div3 img{
  width: 250px;
  height:300px;
  object-fit: cover;
  border-radius: 30px;
}

   
</style>

</head>
<body>

<div class="card">

  <div class="div1">
    <img src="royal.jpeg" alt="Main Image">
  </div>

  <div class="div2">
    <h3>Usman Abdulrazaq Jalingo</h3>
    <p>Chigarin Muri</p>
  </div>
  
  <div class="div3">
    <img src="OIP.jpeg" alt="Icon Image">
  </div>

</div>

</body>
</html>
