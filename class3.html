<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form action="www.google.com" method="post">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="Name" placeholder="John Doe">
    <br>
    <label for="usernameInput">Username</label>
    <input type="text" id="usernameInput" name="Username" placeholder="Naklas" name="Username">
    <br>
    <label for="passwordInput">Password</label>
    <input type="password" id="passwordInput" name="password">
    <br>
    CheckBox
    <br>
    <label for="maleCheckbox">Male</label>
    <input type="checkbox" id="maleCheckbox">
    <label for="femaleCheckbox">Female</label>
    <input type="checkbox" id="femaleCheckbox">
    <br>
    Radio Button
    <br>
    <label for="maleRadio">Male</label>
    <input type="radio" name="gender" id="maleRadio">
    <label for="femaleRadio">Female</label>
    <input type="radio" name="gender" id="femaleRadio">
    <br>
    <input type="submit" value="button">
    <br>
    <input type="button" value="button">
  </form>
</body>

</html>
